services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Inside the compose network the backend is reached by service name
      NUXT_BACKEND_URL: ${BACKEND_URL}
    volumes:
      - .:/app:rw
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
